[container.mongo]
port = 27_017
internalPort = 27_017

  [container.mongo.docker]
  image = "mongo:7"
  container = "work-tools-mongo"

  [container.mongo.root]
  username = "admin"
  password = "admin"

  [container.mongo.app]
  db = "workTools"
  collection = "workTools"
